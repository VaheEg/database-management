# Throwaway in-memory database, for trying the API out without installing
# PostgreSQL. Everything is lost on shutdown.
#
#     ./gradlew bootRun --args='--spring.profiles.active=h2'
#
# H2 console: http://localhost:8080/h2-console  (JDBC URL jdbc:h2:mem:appdb, user sa, no password)
spring.datasource.url=jdbc:h2:mem:appdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# The in-memory database starts empty every time, so Hibernate always has to create the tables,
# whatever the main profile says
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
