# =============================================================================
#  THE ONLY THREE LINES YOU NEED TO CHANGE
# -----------------------------------------------------------------------------
#  This is the application's OWN PostgreSQL database — where users, roles,
#  registered connections, invitations and audit rows are stored. It has nothing
#  to do with the external databases users register through /api/db-connections.
#
#  Create the database once, e.g.:   createdb db_manager
#  Then either edit the three values below, or leave them and export
#  DB_URL / DB_USERNAME / DB_PASSWORD in the environment instead.
#
#  No PostgreSQL at hand? Run with the throwaway in-memory profile:
#      ./gradlew bootRun --args='--spring.profiles.active=h2'
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_manager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${SERVER_PORT:8080}
spring.application.name=DatabaseManagment

# Hibernate creates and evolves the tables from the JPA entities on startup, so
# there is no schema script to run by hand. Switch to 'validate' once the schema
# is settled and you manage changes with migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Security -----------------------------------------------------------------
# Dev defaults so the app boots out of the box. Override BOTH in any real
# environment: anyone holding the JWT secret can mint valid tokens, and the
# crypto secret is what protects the external database passwords at rest.
app.jwt.secret=${APP_JWT_SECRET:change-me-local-dev-secret-at-least-32-chars-long}
app.jwt.expiration=12h
app.jwt.issuer=db-manager
app.crypto.secret=${APP_CRYPTO_SECRET:change-me-local-dev-crypto-secret-at-least-32-chars}

# --- Swagger / OpenAPI --------------------------------------------------------
# UI:   http://localhost:8080/swagger-ui.html
# JSON: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Keeps the token you paste into "Authorize" across page reloads.
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true

logging.level.org.hibernate.SQL=info
