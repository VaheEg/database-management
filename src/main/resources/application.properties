spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_manager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${SERVER_PORT:8080}
spring.application.name=DatabaseManagment

# Hibernate creates and evolves the tables from the JPA entities on startup, so
# there is no schema script to run by hand. Switch to 'validate' once the schema
# is settled and you manage changes with migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Security -----------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:change-me-local-dev-secret-at-least-32-chars-long}
app.jwt.expiration=12h
app.jwt.issuer=db-manager
app.crypto.secret=${APP_CRYPTO_SECRET:change-me-local-dev-crypto-secret-at-least-32-chars}

# --- Email verification (premium upgrade) -------------------------------------
# Connecting an email address to gain PREMIUM requires typing back a six-digit
# code sent to it. Only the hash of the code is stored.
app.verification.code-ttl=10m
app.verification.max-attempts=5
app.verification.resend-interval=60s
app.verification.mail-from=${APP_MAIL_FROM:no-reply@db-manager.local}

app.verification.mail-enabled=${APP_MAIL_ENABLED:false}
#spring.mail.host=smtp.example.com
#spring.mail.port=587
#spring.mail.username=${SMTP_USERNAME:}
#spring.mail.password=${SMTP_PASSWORD:}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Keeps the token you paste into "Authorize" across page reloads.
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true

logging.level.org.hibernate.SQL=info
