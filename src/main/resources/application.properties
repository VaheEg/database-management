server.port=8080

spring.application.name=DatabaseManagment

# The application's own database (in-memory H2 for now). This is unrelated to
# the external databases users register in DB_CONNECTION_DETAILS, which are
# connected to at runtime with their own stored credentials.
spring.datasource.url=jdbc:h2:mem:appdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dev default so the app boots out of the box. Override with APP_JWT_SECRET in
# any real environment — anyone holding this string can mint valid tokens.
app.jwt.secret=${APP_JWT_SECRET:change-me-local-dev-secret-at-least-32-chars-long}
app.jwt.expiration=12h
app.jwt.issuer=db-manager

logging.level.org.hibernate.SQL=debug
